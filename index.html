<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section theme-toggle">
          <label class="toggle-label">
            <input type="checkbox" id="theme-toggle" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-text">LIGHT</span>
          </label>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="name-input-section" class="hidden">
          <p class="name-input-label">¡Nueva puntuación top 5! Ingresa tu nombre:</p>
          <div class="name-input-row">
            <input type="text" id="player-name" maxlength="16" placeholder="Tu nombre" autocomplete="off" />
            <button id="submit-score-btn">Guardar</button>
          </div>
        </div>
        <div id="records-table"></div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <section id="start-records">
    <div class="start-records-header">
      <span class="label">MEJORES PUNTUACIONES</span>
      <button id="clear-records-btn">Borrar records</button>
    </div>
    <div id="start-records-table"></div>
  </section>

  <script src="game.js"></script>
</body>
</html>
